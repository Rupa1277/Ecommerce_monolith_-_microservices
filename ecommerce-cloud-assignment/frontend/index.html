<!doctype html><html><head><meta charset="UTF-8"/><title>ShopEasy</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8}
nav{background:#1a73e8;padding:12px 24px;display:flex;gap:12px;align-items:center}
nav b{color:#fff;font-size:20px;margin-right:auto}
nav button{background:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
nav button.on{background:#fbbc04;font-weight:bold}
main{max-width:900px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 1px 4px #0002;text-align:center}
.card .e{font-size:48px}
.btn{background:#1a73e8;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}
.row{background:#fff;padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
input{display:block;width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
.ok{background:#d4edda;padding:12px;border-radius:8px;margin-top:12px}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
